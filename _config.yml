# GitHub Pages 项目站点，无需重命名仓库。
title: "Personal Homepage"
description: "Personal academic homepage."
url: "https://w-jiahao.github.io"
baseurl: "/wangjiahao"
repository: "W-jiahao/wangjiahao"
locale: "en"
timezone: "Asia/Shanghai"
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
minimal_mistakes_skin: "default"
include:
  - _pages
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
exclude:
  - docs
  - test
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - minimal-mistakes-jekyll.gemspec
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - CHANGELOG.md
  - staticman.yml
  - assets/css/main.scss
  - assets/js
  - .github
  - .bundle
  - scripts
